name: Release

on:
  workflow_dispatch:
  schedule:
    # Once a week
    - cron: "0 0 * * 0"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Prepare new release

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone SteamDatabase/Protobufs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SteamDatabase/Protobufs
          path: SteamDatabaseProtobufs

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile protobuf files to TypeScript
        run: |
          rm protobuf/*.proto
          cp SteamDatabaseProtobufs/csgo/*.proto protobuf
          chmod -R a-x protobuf/*.proto
          pnpm run generate
          rm -rf SteamDatabaseProtobufs

      - name: Check for modified files
        id: git-check
        run: |
          echo "modified=$(if [ -n "$(git status --porcelain)" ]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT

      - name: Publish new version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "feat: regenerate source files"
          pnpm run build
          pnpm version patch
          git push --follow-tags
          pnpm stage publish
